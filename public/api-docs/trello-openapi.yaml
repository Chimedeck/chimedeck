openapi: 3.0.3
info:
  title: ChimeDeck Trello Compatible Adapter API
  version: 1.0.0
  description: |
    Trello-compatible API mounted at `/trello/1/*`.

    Token formats:
    - Authorization: Bearer hf_xxx
    - Query: ?token=hf_xxx

    Quick test flow:
    1. Create or copy an API token (`hf_...`) from Native API token endpoints.
    2. Authorize here with `Bearer hf_...` or pass `token` query param.
    3. Call `/trello/1/members/me`, then create board/list/card and custom fields.
servers:
  - url: /
    description: Same-origin API base (works with Vite proxy in dev)

tags:
  - name: Members
  - name: Boards
  - name: Lists
  - name: Cards
  - name: Checklists
  - name: Labels
  - name: Organizations
  - name: Actions
  - name: Search
  - name: CustomFields

components:
  securitySchemes:
    TrelloBearer:
      type: http
      scheme: bearer
      bearerFormat: API_TOKEN
    TrelloTokenQuery:
      type: apiKey
      in: query
      name: token
  schemas:
    TrelloError:
      type: object
      properties:
        message:
          type: string
          example: The requested resource was not found.
        error:
          type: string
          example: ERROR
    TrelloMember:
      type: object
      additionalProperties: true
      example:
        id: user-1
        fullName: Jane Doe
        username: jane
    TrelloBoard:
      type: object
      additionalProperties: true
      example:
        id: board-1
        name: Product Roadmap
        closed: false
    TrelloList:
      type: object
      additionalProperties: true
      example:
        id: list-1
        idBoard: board-1
        name: To Do
    TrelloCard:
      type: object
      additionalProperties: true
      example:
        id: card-1
        idBoard: board-1
        idList: list-1
        name: Implement API Docs
        closed: false
    TrelloAction:
      type: object
      additionalProperties: true
      example:
        id: action-1
        type: commentCard
        data:
          text: Hello
    TrelloSearchResponse:
      type: object
      properties:
        boards:
          type: array
          items: { $ref: '#/components/schemas/TrelloBoard' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/TrelloCard' }
        members:
          type: array
          items: { $ref: '#/components/schemas/TrelloMember' }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: true
    TrelloCustomField:
      type: object
      additionalProperties: true
      example:
        id: cf-1
        idModel: board-1
        modelType: board
        name: Priority
        type: list
    TrelloCustomFieldItem:
      type: object
      additionalProperties: true
      example:
        id: cfi-1
        idCustomField: cf-1
        idModel: card-1
        modelType: card
        value:
          text: High

security:
  - TrelloBearer: []
  - TrelloTokenQuery: []

paths:
  /trello/1/members/me:
    get:
      tags: [Members]
      summary: Get current Trello-compatible member profile
      responses:
        '200':
          description: Member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloMember'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloError'

  /trello/1/members/{idMember}:
    get:
      tags: [Members]
      summary: Get member by id
      parameters:
        - name: idMember
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloMember'

  /trello/1/members/me/boards:
    get:
      tags: [Members]
      summary: List boards for current member
      responses:
        '200':
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloBoard' }

  /trello/1/boards:
    post:
      tags: [Boards]
      summary: Create board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Sprint Board }
                idOrganization: { type: string }
                defaultLists: { type: boolean, default: true }
      responses:
        '200':
          description: Board created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloBoard'

  /trello/1/boards/{idBoard}:
    get:
      tags: [Boards]
      summary: Get board
      parameters:
        - name: idBoard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloBoard'
    put:
      tags: [Boards]
      summary: Update board
      parameters:
        - name: idBoard
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Board updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloBoard'
    delete:
      tags: [Boards]
      summary: Delete/archive board
      parameters:
        - name: idBoard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/boards/{idBoard}/lists:
    get:
      tags: [Boards]
      summary: List board lists
      parameters:
        - name: idBoard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloList' }

  /trello/1/boards/{idBoard}/cards:
    get:
      tags: [Boards]
      summary: List board cards
      parameters:
        - name: idBoard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloCard' }

  /trello/1/lists:
    post:
      tags: [Lists]
      summary: Create list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                idBoard: { type: string }
                pos: { oneOf: [{ type: string }, { type: number }], example: bottom }
      responses:
        '200':
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'

  /trello/1/lists/{idList}:
    get:
      tags: [Lists]
      summary: Get list
      parameters:
        - name: idList
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'
    put:
      tags: [Lists]
      summary: Update list
      parameters:
        - name: idList
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'
    delete:
      tags: [Lists]
      summary: Delete list
      parameters:
        - name: idList
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/cards:
    post:
      tags: [Cards]
      summary: Create card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                idList: { type: string }
                desc: { type: string }
                due: { type: string, format: date-time }
      responses:
        '200':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCard'

  /trello/1/cards/{idCard}:
    get:
      tags: [Cards]
      summary: Get card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCard'
    put:
      tags: [Cards]
      summary: Update card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCard'
    delete:
      tags: [Cards]
      summary: Delete card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/cards/{idCard}/actions/comments:
    post:
      tags: [Cards]
      summary: Add comment to card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: Comment action created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloAction'

  /trello/1/cards/{idCard}/actions:
    get:
      tags: [Cards]
      summary: List card actions
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloAction' }

  /trello/1/cards/{idCard}/customFieldItems:
    get:
      tags: [CustomFields]
      summary: List custom field values on card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Card custom field items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloCustomFieldItem' }

  /trello/1/cards/{idCard}/customField/{idCustomField}/item:
    put:
      tags: [CustomFields]
      summary: Upsert custom field value on card
      parameters:
        - name: idCard
          in: path
          required: true
          schema: { type: string }
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: object
                  properties:
                    text: { type: string }
                    number: { type: string }
                    date: { type: string, format: date-time }
                    checked: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Value upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCustomFieldItem'

  /trello/1/checklists:
    post:
      tags: [Checklists]
      summary: Create checklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idCard: { type: string }
                name: { type: string }
                idChecklistSource: { type: string }
      responses:
        '200':
          description: Checklist created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/checklists/{idChecklist}:
    get:
      tags: [Checklists]
      summary: Get checklist
      parameters:
        - name: idChecklist
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Checklist details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/labels:
    post:
      tags: [Labels]
      summary: Create label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idBoard: { type: string }
                name: { type: string }
                color: { type: string }
      responses:
        '200':
          description: Label created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/labels/{idLabel}:
    get:
      tags: [Labels]
      summary: Get label
      parameters:
        - name: idLabel
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Label
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags: [Labels]
      summary: Update label
      parameters:
        - name: idLabel
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated label
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      tags: [Labels]
      summary: Delete label
      parameters:
        - name: idLabel
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/organizations:
    post:
      tags: [Organizations]
      summary: Create organization (workspace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                name: { type: string }
      responses:
        '200':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/organizations/{idOrg}:
    get:
      tags: [Organizations]
      summary: Get organization
      parameters:
        - name: idOrg
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/actions/{idAction}:
    get:
      tags: [Actions]
      summary: Get action by id (comment or activity)
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloAction'
    put:
      tags: [Actions]
      summary: Update action text (comment actions only)
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                value: { type: string }
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloAction'
        '422':
          description: Unsupported action text update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloError'
    delete:
      tags: [Actions]
      summary: Delete action (comment actions only)
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/actions/{idAction}/text:
    put:
      tags: [Actions]
      summary: Alias endpoint to update comment action text
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloAction'

  /trello/1/actions/{idAction}/reactions:
    post:
      tags: [Actions]
      summary: Add reaction to action/comment
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shortName:
                  type: string
                  example: 👍
      responses:
        '200':
          description: Reaction added
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/actions/{idAction}/reactions/{idReaction}:
    delete:
      tags: [Actions]
      summary: Delete reaction from action/comment
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
        - name: idReaction
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reaction deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/actions/{idAction}/reactionsSummary:
    get:
      tags: [Actions]
      summary: Get grouped reaction summary
      parameters:
        - name: idAction
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reaction summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/search:
    get:
      tags: [Search]
      summary: Trello-style search for boards/cards/members/organizations
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: modelTypes
          in: query
          required: false
          schema:
            type: string
            example: boards,cards
        - name: boards_limit
          in: query
          required: false
          schema: { type: integer, default: 10 }
        - name: cards_limit
          in: query
          required: false
          schema: { type: integer, default: 10 }
        - name: members_limit
          in: query
          required: false
          schema: { type: integer, default: 10 }
        - name: organizations_limit
          in: query
          required: false
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Search result buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloSearchResponse'

  /trello/1/search/members/:
    get:
      tags: [Search]
      summary: Search members only
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 8 }
      responses:
        '200':
          description: Matching members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrelloMember' }

  /trello/1/customFields:
    post:
      tags: [CustomFields]
      summary: Create custom field on board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, idModel, modelType]
              properties:
                name: { type: string, example: Priority }
                type: { type: string, enum: [text, number, date, checkbox, list] }
                idModel: { type: string, example: board-1 }
                modelType: { type: string, enum: [board], example: board }
      responses:
        '200':
          description: Custom field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCustomField'

  /trello/1/customFields/{idCustomField}:
    get:
      tags: [CustomFields]
      summary: Get custom field definition
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Custom field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCustomField'
    put:
      tags: [CustomFields]
      summary: Update custom field definition
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated custom field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloCustomField'
    delete:
      tags: [CustomFields]
      summary: Delete custom field and attached card values
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object

  /trello/1/customFields/{idCustomField}/options:
    get:
      tags: [CustomFields]
      summary: List dropdown options for custom field
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      tags: [CustomFields]
      summary: Add dropdown option to custom field
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  oneOf:
                    - type: string
                    - type: object
                      properties:
                        text: { type: string }
                color: { type: string, nullable: true }
      responses:
        '200':
          description: Option added
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /trello/1/customFields/{idCustomField}/options/{idOption}:
    delete:
      tags: [CustomFields]
      summary: Remove dropdown option from custom field
      parameters:
        - name: idCustomField
          in: path
          required: true
          schema: { type: string }
        - name: idOption
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option removed
          content:
            application/json:
              schema:
                type: object
